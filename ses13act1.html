<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

        <title>Boot strap intro</title>

        <style>
            body{
                background-color: lightgoldenrodyellow;
                font-family: Arial, Helvetica, sans-serif;
                padding: 30px 15px;
            }

            h1{
                text-align: center;
                color: #FF5A43;
            }

            .hobby-card{
                text-align: center;
                border: 2px dashed #FF5A43;
                border-radius: 10px;
                padding: 20px;
                margin-bottom: 20px;
                background-color: #fff8e1;
            }

            .hobby-card h3{
                color: #FF5A43  ;
            }

        </style>

    </head>
    <body>

        <h1>My hobby cards</h1>

        <div class="container">

            <div class="row">
                <div class="hobby-card">
                    <div class="col-12 col-md-6 col-lg-4">
                        <h3>Drawing</h3>
                        <p>I love sketching animals and comic characters</p>
                    </div>
                </div>

                <div class="hobby-card">
                    <div class="col-12 col-md-6 col-lg-4">
                        <h3>Football</h3>
                        <p>I play football with my friends daily</p>
                    </div>
                </div>

                <div class="hobby-card">
                    <div class="col-12 col-md-6 col-lg-4">
                        <h3>Reading</h3>
                        <p>My favourite books are Adventure Stories</p>
                    </div>
                </div>

            </div>
        </div>
    </body>
</html>
